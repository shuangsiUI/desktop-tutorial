<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 某某国际物流有限公司</title><link rel="stylesheet" href="/replica.css"><link rel="stylesheet" href="/login.css"></head><body><header class="nav"><span class="company-brand">某某国际物流有限公司</span></header><main class="login-panel"><h1>登录物流系统</h1><p>使用管理员分配的账号登录，系统按账号权限显示业务数据。</p><form id="loginForm"><label>账号<input name="username" autocomplete="username" required maxlength="80"></label><label>密码<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label><label>验证器验证码（已启用双重验证时填写）<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></label><p id="loginError" role="alert"></p><button class="btn btn-green" type="submit">登录</button></form><p id="setupNotice" hidden>系统尚未创建管理员。请在服务器终端运行 npm run user:create -- --username your-admin --role admin 初始化，密码由你自行设置。</p></main><script type="module" src="/login.js"></script></body></html>
